<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="西暦と旧暦を併記する月間カレンダー" />
    <title>暦かさね | 西暦・旧暦カレンダー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">GREGORIAN × LUNISOLAR</p>
        <h1>暦かさね</h1>
        <p>西暦と旧暦を、ひと目で。</p>
      </header>

      <section class="calendar-card" aria-labelledby="calendar-title">
        <div class="calendar-toolbar">
          <button class="icon-button" id="previous-month" type="button" aria-label="前の月">←</button>
          <div>
            <h2 id="calendar-title"></h2>
            <p id="month-subtitle"></p>
          </div>
          <button class="icon-button" id="next-month" type="button" aria-label="次の月">→</button>
        </div>
        <button class="today-button" id="today-button" type="button">今日に戻る</button>

        <div class="weekday-row" aria-hidden="true">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div id="calendar-grid" class="calendar-grid" aria-live="polite"></div>
      </section>

      <section class="details-card" aria-live="polite" aria-labelledby="details-title">
        <p class="eyebrow">SELECTED DAY</p>
        <h2 id="details-title">日付を選択してください</h2>
        <p id="selected-lunar" class="lunar-detail"></p>
        <p id="selected-note" class="detail-note"></p>
      </section>

      <aside class="notice">
        <strong>表示について</strong>
        <p>旧暦表示はブラウザの国際化機能による太陰太陽暦の参考表示です。祭事・業務など正確性が必要な用途では、採用する暦法・タイムゾーンを要件として明示し、専門の暦データと照合してください。</p>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
